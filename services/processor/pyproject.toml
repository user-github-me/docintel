[project]
name = "docintel-processor"
version = "1.0.0"
description = "DocIntel document processing service: PDF text extraction, OCR, spreadsheet parsing, page rendering and embeddings."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pillow>=11.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "charset-normalizer>=3.3",
  "fastembed>=0.4",
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ocr: requires the tesseract binary (run inside the Docker image)"]
